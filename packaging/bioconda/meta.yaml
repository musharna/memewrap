# DRAFT bioconda recipe for memewrap. NOT submitted to bioconda-recipes.
#
# Blocked on a PyPI release: PyPI carries 0.1.0 only, so there is no sdist for
# 0.3.0 and `sha256` below is a placeholder. Before submitting:
#   1. release 0.3.0 to PyPI;
#   2. replace sha256 with the sdist's (`pip download memewrap==0.3.0
#      --no-binary :all: --no-deps`, then `sha256sum`);
#   3. run `bioconda-utils lint` and a local `conda build` -- neither has been
#      run on this file.
#
# Written without the usual Jinja `set version = ...` header: this repo's
# check-yaml hook parses every .yaml file, and a Jinja statement line is not
# YAML. The two Jinja expressions that remain are quoted, which conda-build
# renders the same. Reintroduce the `set` lines in the bioconda-recipes copy if
# its linter asks for them.

package:
  name: memewrap
  version: "0.3.0"

source:
  url: https://pypi.org/packages/source/m/memewrap/memewrap-0.3.0.tar.gz
  sha256: REPLACE_WITH_SDIST_SHA256_AFTER_PYPI_RELEASE

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - "{{ pin_subpackage('memewrap', max_pin='x.x') }}"

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - numpy >=1.24
    - pandas >=2.0
    # The point of packaging this on bioconda rather than only PyPI: pip cannot
    # install the binaries the wrappers drive. SEA needs MEME >=5.4.0.
    - meme >=5.4.0

test:
  imports:
    - memewrap
  commands:
    - python -c "from memewrap import require_tools, DEFAULT_TOOLS, ENRICHMENT_TOOLS; require_tools(DEFAULT_TOOLS + ENRICHMENT_TOOLS)"

about:
  home: https://github.com/musharna/memewrap
  summary: Python wrappers for the MEME-suite CLI (STREME, TOMTOM, FIMO, SEA, AME).
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/musharna/memewrap

extra:
  recipe-maintainers:
    - musharna
