# DRAFT bioconda recipe for memewrap. NOT submitted to bioconda-recipes.
#
# The checksum is the 0.3.0 sdist on PyPI. Checked by hand on 2026-09-19 in an
# environment created from the requirements below (bioconda meme 5.5.9, python
# 3.12): the build script installs, the test command passes, and the repo's 87
# tests pass with none skipped. `conda build` of this directory (conda-forge +
# bioconda channels) then built memewrap-0.3.0-py_0.conda and its test section
# passed, and `bioconda-utils lint --packages memewrap` inside a checkout of
# bioconda-recipes reports no problems (a copy with the licence and run_exports
# removed fails it with missing_license and missing_run_exports, so the linter
# does read this file). Nothing technical remains before submitting.
#
# Written without the usual Jinja `set version = ...` header: this repo's
# check-yaml hook parses every .yaml file, and a Jinja statement line is not
# YAML. The two Jinja expressions that remain are quoted, which conda-build
# renders the same. Reintroduce the `set` lines in the bioconda-recipes copy if
# its linter asks for them.

package:
  name: memewrap
  version: "0.3.0"

source:
  url: https://pypi.org/packages/source/m/memewrap/memewrap-0.3.0.tar.gz
  sha256: 0196c62ae5e1438969008dab4bc764bdcb280a5f6b59024638836e220c96c38d

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv"
  run_exports:
    - "{{ pin_subpackage('memewrap', max_pin='x.x') }}"

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - numpy >=1.24
    - pandas >=2.0
    # The point of packaging this on bioconda rather than only PyPI: pip cannot
    # install the binaries the wrappers drive. SEA needs MEME >=5.4.0.
    - meme >=5.4.0

test:
  imports:
    - memewrap
  commands:
    - python -c "from memewrap import require_tools, DEFAULT_TOOLS, ENRICHMENT_TOOLS; require_tools(DEFAULT_TOOLS + ENRICHMENT_TOOLS)"

about:
  home: https://github.com/musharna/memewrap
  summary: Python wrappers for the MEME-suite CLI (STREME, TOMTOM, FIMO, SEA, AME).
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/musharna/memewrap

extra:
  recipe-maintainers:
    - musharna
