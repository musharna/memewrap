# CI installs the MEME suite. That costs a few minutes per run and it is the
# whole point of this workflow.
#
# The tests that matter here drive external binaries. A CI job that installed
# only the Python dependencies would run the 40-odd pure-logic tests, SKIP every
# real-execution test, and report green -- and a skipped test is indistinguishable
# from an absent one in a summary line. This project has that exact failure in a
# sibling repo's history: an evaluation's control had never once run in CI
# because of a module-level skipif, and nothing said so for weeks.
#
# So `assert-real-execution-ran` below fails the build if the MEME-marked tests
# did not actually execute. Installing the suite and then silently skipping is
# the failure mode worth guarding, not the install itself.

name: tests

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch would otherwise run this twice -- once for `push`, once
# for `pull_request` -- and the MEME install makes each run expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: meme
          create-args: >-
            python=3.12
            meme
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: Install memewrap
        run: pip install -e '.[dev]'

      - name: Confirm the MEME binaries are visible to the wrappers
        run: |
          python -c "
          from memewrap.tools import require_tools
          print({k: str(v) for k, v in require_tools().items()})
          "

      - name: Run the suite
        run: pytest -q --junitxml=results.xml

      - name: assert-real-execution-ran
        # The guard described in the header. `-m meme` selects exactly the tests
        # that need the binaries; if any were skipped, or if none were collected,
        # the wrappers were never actually exercised against STREME/TOMTOM/FIMO
        # and the green suite above means considerably less than it appears to.
        run: |
          pytest -m meme -q --junitxml=meme.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          s = ET.parse("meme.xml").getroot().find("testsuite")
          tests = int(s.get("tests", 0))
          skipped = int(s.get("skipped", 0))
          print(f"meme-marked: {tests} collected, {skipped} skipped")
          if tests == 0:
              sys.exit("no MEME-marked tests were collected -- the real-execution "
                       "suite has vanished from CI")
          if skipped:
              sys.exit(f"{skipped} MEME-marked test(s) SKIPPED -- the binaries were "
                       "not found, so nothing was verified against the real tools")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check memewrap tests
      - run: ruff format --check memewrap tests

  package:
    # The sdist is what users get from `pip install --no-binary`, and its
    # contents are chosen by setuptools heuristics that fail SILENTLY. Before
    # MANIFEST.in existed the default selection matched `tests/test_*.py` and
    # dropped `tests/conftest.py`, shipping a tests directory that looked
    # complete and could not run -- every fixture lives in that one file.
    # Nothing reported it; the build succeeded and `twine check` PASSED.
    #
    # So this asserts the sdist against git rather than a hand-written list,
    # which is the part that cannot drift: any .py added under tests/ is covered
    # the day it is committed, with no CI edit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: The sdist carries every test file git does, plus the metadata
        run: |
          set -euo pipefail
          listing=$(tar tzf dist/*.tar.gz | sed 's|^[^/]*/||')

          for want in LICENSE README.md pyproject.toml; do
            echo "$listing" | grep -qx "$want" \
              || { echo "::error::sdist is MISSING $want"; exit 1; }
          done

          # The invariant: tests in the sdist == tests tracked by git.
          git ls-files 'tests/*.py' | sort > /tmp/want.txt
          echo "$listing" | grep -E '^tests/.*\.py$' | sort > /tmp/got.txt
          if ! diff -u /tmp/want.txt /tmp/got.txt; then
            echo "::error::sdist test files differ from git (- want, + got)"
            exit 1
          fi
          echo "sdist ships $(wc -l < /tmp/got.txt) test files, matching git"

      - name: The wheel does NOT carry tests
        # The conventional split, and why the check above is sdist-only: a wheel
        # shipping a top-level `tests` package would collide with any other
        # installed distribution doing the same.
        run: |
          set -euo pipefail
          if unzip -l dist/*.whl | grep -qE ' tests/'; then
            echo "::error::wheel leaked the tests directory"; exit 1
          fi
          echo "wheel carries no tests, as intended"
